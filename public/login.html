<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Iniciá sesión en Eatsy para gestionar los pedidos de tu local.">
  <title>Iniciar sesión · Eatsy</title>
  <link rel="icon" href="/img/icono.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card card-app">
      <div class="text-center mb-4">
        <img src="/img/logo.png" alt="Eatsy" class="login-logo">
        <h1 class="h4 fw-bold mt-3 mb-1">¡Bienvenido!</h1>
        <p class="text-muted small mb-0">Ingresá con tu usuario para continuar</p>
      </div>

      <div class="alert alert-warning d-none py-2 small" id="demo-info" role="note">
        <div class="fw-semibold mb-1"><i class="bi bi-cone-striped me-1"></i>Modo demostración</div>
        Contraseña <code>123456789</code> para todos:
        <div class="d-flex flex-wrap gap-1 mt-2" id="demo-users"></div>
      </div>

      <div class="alert alert-danger d-none py-2 small" id="login-error" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label fw-medium">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="nombre" name="nombre" autocomplete="username" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label for="contrasena" class="form-label fw-medium">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="contrasena" name="contrasena" autocomplete="current-password" required>
            <button class="btn btn-outline-secondary" type="button" id="toggle-pass" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-brand w-100 py-2 rounded-pill fw-semibold" data-loading-text="Ingresando...">
          <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
        </button>
      </form>

      <hr class="my-4">
      <a href="/llamados" class="d-block text-center small text-muted text-decoration-none">
        <i class="bi bi-display me-1"></i>Abrir pantalla de llamados (pública)
      </a>
    </section>
    <p class="text-center text-muted small mt-4 mb-0">Eatsy · AutoPedido 2.0</p>
  </main>

  <script src="/vendor/sweetalert2/sweetalert2.all.min.js"></script>
  <script type="module" src="/js/auth/login.js"></script>
</body>
</html>
